apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockpit-api
  namespace: stockpit
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stockpit-api
  template:
    metadata:
      labels:
        app: stockpit-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/joseajrgr/stockpit-api:8544bbebeafd0cf3cfd40842acddfe0f7dda7bce
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: stockpit
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: stockpit-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stockpit-db-credentials
                  key: password
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: stockpit-api
  namespace: stockpit
  labels:
    app: stockpit-api
spec:
  selector:
    app: stockpit-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
